<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deja de Ser NPC</title>
  <link rel="stylesheet" href="./styles/main.css" />

  <!-- Importmap con versiones fijas compatibles mediante CDN (jsDelivr) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.3/lib/three-vrm.module.js",
        "kalidokit": "https://cdn.jsdelivr.net/npm/kalidokit@1.1.5/dist/kalidokit.es.js",
        "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs"
      }
    }
  </script>
</head>
<body>
  <!-- Video de cámara web oculto -->
  <video id="webcam" playsinline autoplay muted></video>

  <!-- Contenedor del canvas 3D -->
  <div id="canvas-container"></div>

  <!-- Contenedor de la interfaz de usuario -->
  <div id="ui-container"></div>

  <!-- Entrada principal del proyecto -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
